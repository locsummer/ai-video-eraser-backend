version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aivideoeraser-postgres
    restart: always
    environment:
      POSTGRES_DB: aivideoeraser
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: SecretPassword123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./server
    container_name: aivideoeraser-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aivideoeraser
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: SecretPassword123!
      APP_JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      APP_WORKER_SIMULATED_PROCESSING: "true"
    volumes:
      - backend_uploads:/app/uploads
      - backend_data:/app/data

volumes:
  postgres_data:
  backend_uploads:
  backend_data:
